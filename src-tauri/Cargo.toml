[package]
name = "create-audio-bible"
version = "0.1.0"
description = "Build audio Bibles from sermon readings"
authors = ["Blake"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "create_audio_bible_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
logoxide-text = "0.1"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
mp3lame-encoder = "0.2.5"
id3 = "1.17.2"
rayon = "1.12.0"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Decoding, resampling, and encoding audio is unusably slow unoptimized
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
